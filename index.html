<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner - Minha Carteira</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>PLANNER</h1>
        <h2>Minha Carteira</h2>

        <div class="formulario">

            <select id="tipo">
                <option>FII</option>
                <option>Ação</option>
                <option>ETF</option>
                <option>BDR</option>
                <option>Renda Fixa</option>
            </select>

            <input type="text" id="ticker" placeholder="Ticker">

            <input type="number" id="qtd" placeholder="Quantidade">

            <input type="number" step="0.01" id="pm" placeholder="Preço Médio">

            <input type="number" step="0.01" id="cotacao" placeholder="Cotação Atual">

            <button id="btnAdicionar">
                Adicionar Ativo
            </button>

        </div>

        <table id="tabela">

            <thead>

                <tr>

                    <th>Tipo</th>
                    <th>Ticker</th>
                    <th>Quantidade</th>
                    <th>Preço Médio</th>
                    <th>Cotação Atual</th>
                    <th>Valor Investido</th>
                    <th>Valor Mercado</th>
                    <th>Lucro / Prejuízo</th>
                    <th>Ações</th>

                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

        <div class="resumo">

            <div class="card">

                <h3>Valor Investido</h3>
                <span id="investido">R$ 0,00</span>

            </div>

            <div class="card">

                <h3>Valor de Mercado</h3>
                <span id="mercado">R$ 0,00</span>

            </div>

            <div class="card">

                <h3>Lucro / Prejuízo</h3>
                <span id="lucro">R$ 0,00</span>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
